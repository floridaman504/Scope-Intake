name: Sync staging schema from production

# Tier 1.7 (migration safety). Copies production's SCHEMA ONLY -- table
# definitions, columns, functions, RLS policies, triggers, indexes -- into
# the separate "scope-staging" Supabase project. Deliberately does NOT copy
# any customer data (jobs, employees, companies), so staging always contains
# zero real plumbing-customer records even though it's a lower-security
# environment than production.
#
# Use this before running any schema change (new column, new table, altered
# constraint) against production:
#   1. Run this workflow manually (Actions tab > Sync staging schema > Run
#      workflow) to make sure staging matches production's current shape.
#   2. Run your migration + rollback against STAGING_DB_URL first. Confirm
#      the app still works and the rollback actually reverses it.
#   3. Only then run the migration against production.
#
# See docs/migration-safety-playbook.md for the full expand-contract
# process and rollback template.
#
# One-time setup (already done): repo secret STAGING_DB_URL, pointing at the
# scope-staging Supabase project's session pooler connection string.

on:
  workflow_dispatch: {} # manual only -- this is a deliberate step you take, not a schedule

permissions:
  contents: read

jobs:
  sync-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are configured
        run: |
          missing=0
          for name in SUPABASE_DB_URL STAGING_DB_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}

      - name: Install postgresql-client (v17, to match Supabase's Postgres server)
        # Same fix as the backup workflow -- ubuntu-latest's default apt
        # repo only ships client v16, but Supabase runs Postgres 17.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Dump production schema (public schema only, no data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # --schema-only: no customer data, structure only.
          # --schema=public: skip Supabase's own auth/storage/realtime
          # schemas -- those already exist identically in every fresh
          # Supabase project and restoring over them isn't safe or needed.
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema-only --schema=public --no-owner --no-privileges \
            -Fc -f schema.dump
          SIZE=$(stat -c%s "schema.dump")
          echo "Schema dump size: $SIZE bytes"
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::Schema dump is suspiciously small ($SIZE bytes) -- refusing to restore. Check SUPABASE_DB_URL."
            exit 1
          fi

      - name: Restore schema into staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -uo pipefail
          # --clean --if-exists: drop-and-recreate each object so staging
          # ends up EXACTLY matching production's current shape, even if
          # staging already had an older/different version of something.
          #
          # NOT using `set -e` around this specific command on purpose:
          # --if-exists stops pg_restore from failing when a POLICY or
          # TRIGGER it's trying to drop doesn't exist, but it can't stop
          # the error when the underlying TABLE those belong to doesn't
          # exist yet either (e.g. the very first sync into a brand new,
          # empty staging database) -- `DROP POLICY IF EXISTS x ON
          # some_table` still errors if `some_table` itself is missing.
          # pg_restore already treats these as non-fatal and keeps going
          # (it prints "errors ignored on restore: N" and continues), but
          # it also exits 1 afterward to flag that something was skipped.
          # The real correctness check is the next step, which compares
          # staging's actual table list against production's -- that's
          # what decides pass/fail, not this exit code.
          /usr/lib/postgresql/17/bin/pg_restore \
            --clean --if-exists --no-owner --no-privileges \
            -d "$STAGING_DB_URL" schema.dump
          restore_exit=$?
          if [ "$restore_exit" -ne 0 ]; then
            echo "pg_restore exited $restore_exit -- usually just harmless 'DROP ... IF EXISTS' noise on a schema that changed shape. Continuing to the verification step, which is the real pass/fail gate."
          fi

      - name: Verify staging matches production's table list
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -euo pipefail
          query="select string_agg(table_name, ',' order by table_name) from information_schema.tables where table_schema='public';"
          prod_tables=$(/usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -tAc "$query")
          staging_tables=$(/usr/lib/postgresql/17/bin/psql "$STAGING_DB_URL" -tAc "$query")
          echo "Production tables: $prod_tables"
          echo "Staging tables:    $staging_tables"
          if [ "$prod_tables" != "$staging_tables" ]; then
            echo "::error::Staging's table list does not match production after sync -- restore likely failed partway through."
            exit 1
          fi
          echo "Staging schema matches production. Safe to test migrations here."

      - name: Reapply anon/authenticated grants (privileges are NOT part of a --no-privileges dump)
        # pg_dump/pg_restore ran above with --no-owner --no-privileges on
        # purpose (see the dump step) -- that means EVERY grant, including
        # schema-level `USAGE ON SCHEMA public`, gets stripped on every
        # single sync, not just table-level SELECT/INSERT/etc. Discovered
        # while building the Task #23 cross-tenant isolation test: staging
        # had no USAGE on schema public for anon/authenticated at all,
        # which made every table lookup fail with "relation does not
        # exist" (not a permissions error -- Postgres can't even resolve
        # the name without schema USAGE) even though the task #22 grants
        # below looked correct.
        #
        # This mirrors production's minimal-privilege grants from task #22
        # exactly (see docs/schema/production-schema-2026-08-09.sql and the
        # audit) so staging stays privilege-accurate after every sync, not
        # just shape-accurate -- otherwise the cross-tenant isolation test
        # (and anyone testing migrations here) silently breaks the next
        # time this workflow runs.
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          grant usage on schema public to anon, authenticated;

          revoke all on all tables in schema public from anon, authenticated;

          grant insert on public.jobs to anon;
          grant select, insert, update, delete on public.jobs to authenticated;
          grant select on public.employees to authenticated;
          grant select on public.user_sessions to authenticated;
          grant select on public.session_policy to authenticated;
          grant select, insert on public.invite_codes to authenticated;
          grant select on public.ai_usage_log to authenticated;
          grant select, insert on public.job_notes to authenticated;
          grant select, insert, update, delete on public.pricebook_items to authenticated;
          grant select, insert, update on public.job_estimates to authenticated;
          grant select, insert, update, delete on public.job_estimate_line_items to authenticated;
          -- companies, billing_guardrails, login_attempts intentionally
          -- receive zero anon/authenticated grants -- see task #22.
          -- job_notes added for task #24 (dispatcher dashboard). pricebook_items,
          -- job_estimates, and job_estimate_line_items added for task #34/#24
          -- (pricing estimator, Phase 1) -- keep this list in sync every time a
          -- new table gets grants; this is exactly the step that was missing
          -- before task #23 found it.
          SQL
          echo "Grants reapplied to match production's minimal-privilege scheme."
